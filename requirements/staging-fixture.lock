# R3 deterministic staging fixture lock.
#
# This is the intentionally small lock for the one-shot fixture control plane,
# not a replacement for the full application environment.  Every dependency
# needed by scripts/run_data_mcp_staging_fixture.py and its shared package
# initialization/import seams is pinned, including pandas/duckdb and their
# selected base dependencies.  Install with the repository's selected pip
# workflow:
#
#   python -m pip install --requirement requirements/staging-fixture.lock
#
# The lock is network-neutral at runtime: the runner itself denies source
# egress.  A clean installation still requires an approved package index or a
# separately verified wheelhouse; no package artifact or credential is embedded
# here.
